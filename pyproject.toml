[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telcut"
version = "0.1.0"
description = "Reply to selected Telegram messages with a real macOS clock screenshot"
requires-python = ">=3.9"
dependencies = ["Telethon>=1.42,<2", "Pillow>=10.4,<12", "python-dotenv>=1,<2"]

[project.scripts]
telcut = "telcut.cli:main"

[tool.setuptools.packages.find]
include = ["telcut*"]
